<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TRIPZY - Participant</title>
    <meta name="theme-color" content="#0ea5e9">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --sky-500: #0ea5e9; --sky-600: #0284c7; --sky-900: #0c4a6e;
            --coral: #f97316; --text-primary: #0c4a6e; --text-muted: #94a3b8;
            --danger: #ef4444; --success: #16a34a;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }

        /* FIX BACKGROUND & HEIGHT: Nurut sama browser */
        html, body {
            min-height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #a8d4f5 linear-gradient(180deg, #a8d4f5 0%, #d4e8f7 40%, #fce8d5 85%, #ffd9b3 100%) no-repeat;
            background-attachment: fixed;
            color: var(--text-primary);
            overflow-x: hidden;
            overflow-y: auto;
        }

        .font-display { font-family: 'Sora', sans-serif; }
        ::-webkit-scrollbar { width: 0; height: 0; }

        .bg-scene { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        .sun { position: absolute; width: 50px; height: 50px; top: 4%; right: 5%; background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="g1" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="%23FFF4B8"/><stop offset="70%" stop-color="%23FFD54F"/><stop offset="100%" stop-color="%23FFB74D"/></radialGradient></defs><circle cx="40" cy="40" r="35" fill="url(%23g1)"/></svg>') no-repeat center/contain; animation: sunGrow 10s ease-in-out infinite; }
        @keyframes sunGrow { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
        .mountains { position: absolute; bottom: 0; left: 0; right: 0; height: 120px; pointer-events: none; background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path fill="%23dce9f5" fill-opacity="0.5" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,224C672,245,768,267,864,261.3C960,256,1056,224,1152,197.3C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>'); background-size: cover; background-position: bottom; }

        .card {
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 20px;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.05); transition: all 0.2s ease; position: relative; overflow: hidden;
        }
        .card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%); pointer-events: none; border-radius: 20px 20px 0 0; }
        
        .btn-primary { background: linear-gradient(135deg, var(--sky-500), var(--sky-600)); color: white; font-weight: 600; padding: 12px 24px; border-radius: 14px; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2); font-family: 'Outfit', sans-serif; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; overflow: hidden; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.6); cursor: pointer; color: var(--sky-600); flex-shrink: 0; z-index: 10; }
        .input-field { width: 100%; background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 14px; padding: 12px 16px; font-size: 16px; color: var(--text-primary); font-family: 'Outfit', sans-serif; }

        /* FIX CENTER LOGIN */
        #loginPage {
            min-height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #loginPage.active { display: flex !important; }

        /* KONTEN UTAMA */
        .app-page {
            display: none;
            width: 100%;
            padding-bottom: 120px;
        }
        .app-page.active { display: block; animation: pageEnter 0.3s ease forwards; }

        @keyframes pageEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: slideUp 0.4s ease forwards; opacity: 0; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* NAVBAR FIX */
        .bottom-nav { 
            position: fixed; 
            bottom: calc(10px + env(safe-area-inset-bottom)); 
            left: 0; right: 0; 
            z-index: 9999; 
            padding: 0 16px;
            pointer-events: none; 
            background: transparent;
        }
        .nav-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8); 
            border-radius: 30px; 
            padding: 12px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); 
            display: flex; 
            align-items: center; 
            justify-content: space-around; 
            pointer-events: auto; 
        }
        
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; transition: all 0.2s ease; color: #94a3b8; background: transparent; border: none; font-family: 'Outfit', sans-serif; width: 20%; padding: 4px; position: relative; z-index: 1; }
        .nav-item.active { color: var(--sky-600); }
        .nav-item span { font-size: 9px; font-weight: 600; }
        
        /* SOS BUTTON */
        .nav-sos-wrapper { position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; margin-top: -24px; z-index: 10; }
        .nav-sos-btn {
            width: 56px; height: 56px; border-radius: 50%; 
            background: #ef4444; color: white; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); 
            border: 3px solid white; 
            cursor: pointer; transition: transform 0.1s; 
            position: relative; overflow: hidden; 
        }
        .nav-sos-btn:active { transform: scale(0.95); }
        .nav-sos-progress { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(transparent 0%, rgba(255,255,255,0.3) 0%); transition: background 0.1s linear; }
        .nav-sos-btn.active { animation: sosShake 0.3s infinite; }

        /* MODALS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(14, 165, 233, 0.4); backdrop-filter: blur(4px); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 24px; }
        .modal-overlay.active { display: flex; }
        .modal-content { width: 100%; max-width: 340px; max-height: 85vh; overflow-y: auto; background: rgba(255, 255, 255, 0.98); border-radius: 24px; border: 1px solid white; transform: scale(0.9); opacity: 0; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .modal-overlay.active .modal-content { transform: scale(1); opacity: 1; }

        /* TOAST */
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20000; width: calc(100% - 32px); max-width: 380px; }
        .toast { background: white; border-radius: 14px; padding: 12px 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border-left: 4px solid var(--sky-500); display: flex; align-items: center; gap: 12px; transform: translateY(-100px); opacity: 0; transition: all 0.3s; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.danger { border-left-color: var(--danger); }

        /* Map Styles - DIGESER JADI 350px */
        .tracking-map-container { 
            position: relative; 
            width: 100%; 
            height: 350px; /* Diperbesar jadi 350px */
            border-radius: 16px; 
            background-color: #f0f9ff;
            /* Background ilustrasi peta SVG */
            background-image: url('data:image/svg+xml;utf8,<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="700" fill="%23f0f9ff"/><path d="M0 350 Q 200 70 400 350 T 800 350" stroke="%23bae6fd" stroke-width="80" fill="none"/><path d="M0 525 Q 200 280 400 525 T 800 525" stroke="%23e0f2fe" stroke-width="40" fill="none"/><rect x="40" y="40" width="80" height="60" fill="%23fff" stroke="%23cbd5e1" rx="8"/><rect x="680" y="80" width="60" height="80" fill="%23fff" stroke="%23cbd5e1" rx="8"/><rect x="300" y="450" width="100" height="60" fill="%23fff" stroke="%23cbd5e1" rx="8"/><circle cx="600" cy="180" r="30" fill="%23d1fae5" stroke="%236ee7b7"/><circle cx="160" y="480" r="40" fill="%23fef3c7" stroke="%23fcd34d"/></svg>');
            background-size: cover;
            background-position: center;
            overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.4); 
        }
        .map-grid { display: none; } /* Grid diilangin biar bersih */
        .map-marker { position: absolute; transform: translate(-50%, -50%); z-index: 5; transition: all 1s linear; }
        .marker-pulse { position: absolute; width: 24px; height: 24px; border-radius: 50%; background: currentColor; opacity: 0.3; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: markerPulse 2s infinite; }
        
        /* Timeline */
        .timeline-mini { position: relative; padding-left: 14px; border-left: 2px solid rgba(14, 165, 233, 0.2); margin-left: 6px; }
        .timeline-mini-item { position: relative; padding-bottom: 10px; }
        .timeline-mini-item:last-child { padding-bottom: 0; }
        .timeline-mini-dot { position: absolute; left: -7px; top: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--sky-500); border: 2px solid white; }

        /* Dest Grid */
        .grid-dest { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .grid-dest .card { cursor: pointer; }
        .grid-dest img { height: 90px; width: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <div class="bg-scene"><div class="sun"></div><div class="mountains"></div></div>
    <div class="toast-container"><div id="toast" class="toast"><div id="toastIcon"></div><span id="toastText" class="font-semibold text-sm flex-1"></span></div></div>

    <!-- LOGIN PAGE -->
    <div id="loginPage" class="app-page active">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8 animate-in">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl card mb-4">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#0ea5e9" stroke-width="2.5"/><path d="M2 17L12 22L22 17" stroke="#0ea5e9" stroke-width="2.5"/><path d="M2 12L12 17L22 12" stroke="#f97316" stroke-width="2.5"/></svg>
                </div>
                <h1 class="font-display text-4xl font-bold bg-gradient-to-r from-sky-600 to-orange-400 bg-clip-text text-transparent mb-2">TRIPZY</h1>
                <p class="text-sky-600 font-medium text-sm">Travel Buddy</p>
            </div>
            <div class="card p-6 animate-in delay-1">
                <div class="mb-4"><label class="text-xs font-bold text-sky-700 uppercase mb-1 block">Email</label><input type="email" id="loginEmail" class="input-field" value="nanda@tripzy.com"></div>
                <div class="mb-6"><label class="text-xs font-bold text-sky-700 uppercase mb-1 block">Password</label><input type="password" id="loginPassword" class="input-field" value="nanda123"></div>
                <button class="btn-primary" onclick="handleLogin()">Masuk</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" class="app-page">
        <header class="sticky top-0 z-50 px-4 py-3 bg-transparent">
            <div class="card flex items-center justify-between px-4 py-3">
                <div class="flex items-center gap-2">
                    <div class="avatar-ring"><img src="https://i.pravatar.cc/100?img=68" alt="Nanda" class="w-9 h-9 rounded-full object-cover"></div>
                    <div><p class="text-sky-400 text-xs">Hai,</p><h3 class="font-bold text-sky-900 text-base">Nanda</h3></div>
                </div>
                <button class="btn-icon" onclick="openModal('ticketModal')" title="Tampilkan Tiket">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </button>
            </div>
        </header>
        <div class="px-4 space-y-4" id="homeContent"></div>
    </div>

    <!-- OTHER PAGES -->
    <div id="bookingPage" class="app-page"><header class="sticky top-0 z-50 px-4 py-3 bg-transparent"><div class="card px-4 py-3"><h1 class="font-display text-xl font-bold text-sky-900">Pemesanan Saya</h1></div></header><div class="px-4 pt-2" id="bookingContent"></div></div>
    <div id="chatPage" class="app-page"><header class="sticky top-0 z-50 px-4 py-3 bg-transparent"><div class="card px-4 py-3"><h1 class="font-display text-xl font-bold text-sky-900">Pesan</h1></div></header><div class="px-4 pt-2" id="chatContent"></div></div>
    <div id="profilePage" class="app-page"><header class="sticky top-0 z-50 px-4 py-3 bg-transparent"><div class="card px-4 py-3"><h1 class="font-display text-xl font-bold text-sky-900">Profil</h1></div></header><div class="px-4 pt-2" id="profileContent"></div></div>

    <!-- BOTTOM NAV -->
    <nav id="bottomNav" class="bottom-nav hidden">
        <div class="nav-container">
            <button class="nav-item active" data-page="mainApp" onclick="navigate('mainApp')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></button>
            <button class="nav-item" data-page="bookingPage" onclick="navigate('bookingPage')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg><span>Booking</span></button>
            
            <!-- SOS CENTER -->
            <div class="nav-sos-wrapper">
                <div class="nav-sos-btn" id="navSosBtn" onmousedown="startSos(event)" onmouseup="cancelSos()" onmouseleave="cancelSos()" ontouchstart="startSos(event)" ontouchend="cancelSos()">
                    <div class="nav-sos-progress" id="navSosProgress"></div>
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="position:relative;z-index:2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                </div>
            </div>

            <button class="nav-item" data-page="chatPage" onclick="navigate('chatPage')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span></button>
            <button class="nav-item" data-page="profilePage" onclick="navigate('profilePage')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profil</span></button>
        </div>
    </nav>

    <!-- MODALS -->
    <div id="ticketModal" class="modal-overlay" onclick="closeOnOverlay(event, 'ticketModal')"><div class="modal-content p-6 text-center"><h2 class="font-display text-lg font-bold text-sky-900 mb-4">E-Ticket Anda</h2><div class="bg-gradient-to-br from-sky-500 to-sky-700 rounded-2xl p-6 text-white mb-6"><div class="w-24 h-24 mx-auto bg-white rounded-lg p-1 mb-4"><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=TRIPZY-ID1215" class="w-full h-full"></div><h3 class="font-bold text-lg">Bali Cultural Trip</h3><p class="text-sky-200 text-sm mb-2">15-17 Desember 2024</p><p class="text-xs text-sky-300">2 Peserta</p></div><button class="btn-primary" onclick="closeModal('ticketModal')">Tutup</button></div></div>
    <div id="itineraryModal" class="modal-overlay" onclick="closeOnOverlay(event, 'itineraryModal')"><div class="modal-content p-5 max-h-[80vh] overflow-y-auto"><div class="flex justify-between items-center mb-4"><h2 class="font-display text-lg font-bold text-sky-900">Rencana Perjalanan</h2><button class="btn-icon" onclick="closeModal('itineraryModal')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div id="itineraryContent"></div></div></div>
    <div id="chatModal" class="modal-overlay" onclick="closeOnOverlay(event, 'chatModal')"><div class="modal-content flex flex-col max-h-[80vh]"><div class="p-3 border-b border-sky-101 flex items-center gap-2"><button class="btn-icon" onclick="closeModal('chatModal')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button><div class="avatar-ring"><img id="chatAvatar" src="" class="w-9 h-9 rounded-full"></div><h3 id="chatName" class="font-bold text-sky-900"></h3></div><div class="flex-1 p-3 overflow-y-auto space-y-2" id="chatMessages"></div><div class="p-3 border-t border-sky-101 flex gap-2"><input type="text" id="chatInput" class="input-field text-sm" placeholder="Ketik pesan..." onkeypress="handleChatEnter(event)"><button class="btn-primary px-3" onclick="sendChat()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div></div></div>
    <div id="sosModal" class="modal-overlay" onclick="closeOnOverlay(event, 'sosModal')"><div class="modal-content p-6 text-center"><div class="w-20 h-20 mx-auto mb-4 rounded-full bg-red-100 flex items-center justify-center animate-pulse"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg></div><h2 class="font-display text-xl font-bold text-red-600 mb-2">SOS Terkirim!</h2><p class="text-sky-600 text-sm mb-6">Bantuan sedang dalam perjalanan.</p><button class="btn-primary bg-gray-500" onclick="closeModal('sosModal')">Tutup</button></div></div>
    <div id="notifDetailModal" class="modal-overlay" onclick="closeOnOverlay(event, 'notifDetailModal')"><div class="modal-content p-5"><div class="flex items-center justify-between mb-4"><h2 class="font-display text-lg font-bold text-sky-900">Notifikasi</h2><button class="btn-icon" onclick="closeModal('notifDetailModal')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div id="notifDetailContent"></div></div></div>
    
    <!-- MODAL BOOKING -->
    <div id="bookingModal" class="modal-overlay" onclick="closeOnOverlay(event, 'bookingModal')">
        <div class="modal-content p-5">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-display text-lg font-bold text-sky-900" id="bookingTitle">Detail Trip</h2>
                <button class="btn-icon" onclick="closeModal('bookingModal')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <img id="bookingImg" src="" class="w-full h-40 object-cover rounded-xl mb-4">
            <div id="bookingDetails" class="mb-4"></div>
            <button id="bookingBtn" class="btn-primary">Pesan Sekarang</button>
        </div>
    </div>

    <script>
        // DATA
        const activeTrip = { id: 'bali-cultural', name: 'Bali Cultural Trip', location: 'Bali', image: 'https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=400&h=300&fit=crop', duration: '3D2N', date: '15-17 Desember 2024', itinerary: [{ day: 1, date: '15 Des', title: 'Arrival', activities: [{ time: '08:00', title: 'Pick-up Bandara', icon: 'plane' }, { time: '15:00', title: 'Rice Terrace', icon: 'camera' }] }, { day: 2, date: '16 Des', title: 'Heritage', activities: [{ time: '06:00', title: 'Sunrise Tanah Lot', icon: 'sun' }] }, { day: 3, date: '17 Des', title: 'Departure', activities: [{ time: '12:00', title: 'Transfer Airport', icon: 'plane' }] }] };
        const notifications = [{ id: 1, type: 'chat', title: 'Pesan dari Guide', msg: 'Jangan lupa besok meeting di loby!', time: '10:30' }, { id: 2, type: 'alert', title: 'Peringatan Cuaca', msg: 'Kemungkinan hujan sore.', time: '08:00' }];
        const chatContacts = [{ id: 1, name: 'Tomi (Guide)', avatar: 'https://i.pravatar.cc/100?img=12', lastMsg: 'Sampai ketemu besok!', time: '10:30', unread: 2 }];
        let chatHistory = [{ sender: 'them', msg: 'Halo Nanda!', time: '10:00' }, { sender: 'me', msg: 'Halo Tom!', time: '10:05' }];
        const destinations = [
            { id: 1, name: 'Raja Ampat', img: 'https://images.unsplash.com/photo-1506929562872-bb421503ef21?w=300&h=200&fit=crop', dur: '5D4N', price: '15.000.000', desc: 'Surga bawah laut terbaik dunia.' },
            { id: 2, name: 'Bromo', img: 'https://images.unsplash.com/photo-1588668214407-6ea9a6d8c272?w=300&h=200&fit=crop', dur: '2D1N', price: '3.500.000', desc: 'Sunrise spektakuler di atas awan.' },
            { id: 3, name: 'Komodo', img: 'https://images.unsplash.com/photo-1516690561799-46d8f74f9abf?w=300&h=200&fit=crop', dur: '4D3N', price: '8.500.000', desc: 'Petualangan melihat komodo liar.' },
            { id: 4, name: 'Bunaken', img: 'https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=300&h=200&fit=crop', dur: '3D2N', price: '5.500.000', desc: 'Snorkeling di dinding terumbu karang.' },
            { id: 5, name: 'Lombok', img: 'https://images.unsplash.com/photo-1506929562872-bb421503ef21?w=300&h=200&fit=crop', dur: '4D3N', price: '4.500.000', desc: 'Keindahan Gunung Rinjani dan Gili.' },
            { id: 6, name: 'Dieng', img: 'https://images.unsplash.com/photo-1577717903315-1691ae25ab3f?w=300&h=200&fit=crop', dur: '2D1N', price: '2.800.000', desc: 'Dataran tinggi dengan candi kuno.' }
        ];
        let myBookings = []; 
        let trackingInterval = null;
        let guidePosition = { x: 30, y: 40 };

        // LOGIN
        function handleLogin() {
            document.getElementById('loginPage').classList.remove('active');
            document.getElementById('loginPage').style.display = 'none';
            
            const mainApp = document.getElementById('mainApp');
            mainApp.classList.add('active');
            document.getElementById('bottomNav').classList.remove('hidden');
            
            window.scrollTo(0, 1);
            window.scrollTo(0, 0);
            
            renderHome();
        }
        
        function handleLogout() { 
            document.querySelectorAll('.app-page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; }); 
            document.getElementById('bottomNav').classList.add('hidden'); 
            document.getElementById('loginPage').style.display = 'flex'; 
            document.getElementById('loginPage').classList.add('active'); 
            window.scrollTo(0, 0);
        }

        // NAV
        function navigate(pageId) { 
            document.querySelectorAll('.app-page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
            const target = document.getElementById(pageId);
            if (target) { target.style.display = 'block'; setTimeout(() => target.classList.add('active'), 10); }
            window.scrollTo(0, 0);
            document.querySelectorAll('.nav-item').forEach(n => { n.classList.remove('active'); if(n.getAttribute('onclick')?.includes(pageId)) n.classList.add('active'); });
            if (pageId === 'mainApp') renderHome(); else if (pageId === 'bookingPage') renderBooking(); else if (pageId === 'chatPage') renderChat(); else if (pageId === 'profilePage') renderProfile();
        }

        window.addEventListener('load', () => { window.scrollTo(0, 1); });

        // RENDER HOME
        function renderHome() {
            const notifIcon = { chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>', alert: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>' };
            const notifColor = { chat: '#0ea5e9', alert: '#f97316' };
            const icons = { plane: 'M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z', camera: 'M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z', sun: 'M12 2v2M12 20v2', food: 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Z' };

            document.getElementById('homeContent').innerHTML = `
                <div class="grid grid-cols-2 gap-3 animate-in">
                    <div class="card p-3 cursor-pointer relative z-10" onclick="openNotifDetail()">
                        <div class="flex items-center justify-between mb-2"><span class="text-[10px] font-bold text-sky-400 uppercase">Notifikasi</span><div class="w-5 h-5 rounded-full bg-sky-100 flex items-center justify-center text-sky-600 text-[10px] font-bold">${notifications.length}</div></div>
                        <div class="flex items-start gap-2">
                            <div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0" style="background:${notifColor[notifications[0].type]}15"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${notifColor[notifications[0].type]}" stroke-width="2">${notifIcon[notifications[0].type]}</svg></div>
                            <div class="min-w-0"><p class="font-semibold text-sky-900 text-[11px] leading-tight truncate">${notifications[0].title}</p><p class="text-sky-500 text-[10px] truncate">${notifications[0].msg}</p></div>
                        </div>
                    </div>
                    <div class="card p-3 cursor-pointer relative z-10" onclick="openItinerary()">
                        <div class="flex items-center justify-between mb-2"><span class="text-[10px] font-bold text-sky-400 uppercase">Itinerary</span><span class="text-[10px] font-bold text-sky-600">Hari 1</span></div>
                        <div class="timeline-mini">
                            ${activeTrip.itinerary[0].activities.slice(0, 2).map((a, i) => `<div class="timeline-mini-item"><div class="timeline-mini-dot"></div><div><p class="text-[10px] font-bold text-sky-600">${a.time}</p><p class="text-[10px] text-sky-900 truncate">${a.title}</p></div></div>`).join('')}
                        </div>
                    </div>
                </div>

                <div class="animate-in delay-1">
                    <div class="flex items-center justify-between mb-2 px-1"><h3 class="font-bold text-sky-900 text-sm">Lokasi Guide</h3><div class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span><span class="text-[10px] text-sky-600">Aktif</span></div></div>
                    <div class="tracking-map-container" id="homeMap"></div>
                </div>

                <div class="animate-in delay-2 mt-2">
                    <h3 class="font-bold text-sky-900 text-sm mb-3 px-1">Destinasi Populer</h3>
                    <div class="grid-dest">
                        ${destinations.map(d => `
                            <div class="card overflow-hidden" onclick="openBookingModal(${d.id})">
                                <img src="${d.img}" alt="${d.name}" class="w-full object-cover">
                                <div class="p-2 relative z-10">
                                    <h4 class="font-bold text-sky-900 text-xs">${d.name}</h4>
                                    <p class="text-sky-500 text-[10px]">${d.dur} • Rp ${d.price}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            initHomeMap();
        }

        function initHomeMap() { const mapEl = document.getElementById('homeMap'); if(!mapEl) return; mapEl.querySelectorAll('.map-marker').forEach(m => m.remove()); const userM = createMarker(50, 50, '#3b82f6', 'Anda'); mapEl.appendChild(userM); const guideM = createMarker(guidePosition.x, guidePosition.y, '#ef4444', 'Guide'); mapEl.appendChild(guideM); if (trackingInterval) clearInterval(trackingInterval); trackingInterval = setInterval(() => { guidePosition.x += (Math.random() - 0.5) * 2; guidePosition.y += (Math.random() - 0.5) * 2; guidePosition.x = Math.max(10, Math.min(90, guidePosition.x)); guidePosition.y = Math.max(10, Math.min(90, guidePosition.y)); const marker = mapEl.querySelector('.guide-marker'); if(marker) { marker.style.left = guidePosition.x + '%'; marker.style.top = guidePosition.y + '%'; } }, 2000); }
        function createMarker(x, y, color, name) { const marker = document.createElement('div'); marker.className = `map-marker ${name === 'Guide' ? 'guide-marker' : ''}`; marker.style.left = x + '%'; marker.style.top = y + '%'; marker.style.color = color; marker.innerHTML = `<div class="marker-pulse"></div><div style="position:relative;z-index:2"><div style="width:24px;height:24px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.15);border:2px solid ${color}"><div style="width:10px;height:10px;background:${color};border-radius:50%"></div></div></div>`; return marker; }

        // BOOKING FLOW
        function openBookingModal(id) {
            const d = destinations.find(item => item.id === id);
            if(!d) return;
            
            document.getElementById('bookingTitle').textContent = d.name;
            document.getElementById('bookingImg').src = d.img;
            document.getElementById('bookingDetails').innerHTML = `
                <div class="flex justify-between mb-2"><span class="text-sky-500 text-xs">Durasi</span><span class="font-bold text-sky-900 text-xs">${d.dur}</span></div>
                <div class="flex justify-between mb-2"><span class="text-sky-500 text-xs">Harga</span><span class="font-bold text-sky-900 text-xs">Rp ${d.price}</span></div>
                <p class="text-sky-600 text-xs mt-2">${d.desc}</p>
            `;
            
            const btn = document.getElementById('bookingBtn');
            if(myBookings.some(b => b.id === id)) {
                btn.textContent = "Sudah Dipesan"; btn.onclick = null; btn.style.opacity = 0.5;
            } else {
                btn.textContent = "Pesan Sekarang"; btn.onclick = () => confirmBooking(d); btn.style.opacity = 1;
            }
            openModal('bookingModal');
        }

        function confirmBooking(trip) {
            myBookings.push(trip);
            closeModal('bookingModal');
            showToast(`Berhasil memesan ${trip.name}!`);
        }

        // SOS
        let sosTimer = null; let sosProgress = 0; const SOS_DURATION = 3000;
        function startSos(e) { e.preventDefault(); const btn = document.getElementById('navSosBtn'); btn.classList.add('active'); sosProgress = 0; updateSosProgress(); sosTimer = setInterval(() => { sosProgress += 50; updateSosProgress(); if (sosProgress >= 100) triggerSos(); }, SOS_DURATION / 20); }
        function updateSosProgress() { const prog = document.getElementById('navSosProgress'); prog.style.background = `conic-gradient(rgba(255,255,255,0.5) ${sosProgress}%, transparent ${sosProgress}%)`; }
        function cancelSos() { const btn = document.getElementById('navSosBtn'); if (!btn.classList.contains('active')) return; clearInterval(sosTimer); sosTimer = null; sosProgress = 0; btn.classList.remove('active'); document.getElementById('navSosProgress').style.background = 'transparent'; }
        function triggerSos() { clearInterval(sosTimer); sosTimer = null; setTimeout(() => { openModal('sosModal'); showToast('SOS Terkirim!', 'danger'); }, 100); }

        // NOTIF
        function openNotifDetail() { const icons = { chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>', alert: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>' }; const colors = { chat: '#0ea5e9', alert: '#f97316' }; document.getElementById('notifDetailContent').innerHTML = notifications.map(n => `<div class="card p-3 mb-2 flex items-start gap-2"><div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" style="background:${colors[n.type]}15"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${colors[n.type]}" stroke-width="2">${icons[n.type]}</svg></div><div><p class="font-bold text-sky-900 text-xs">${n.title}</p><p class="text-sky-600 text-xs">${n.msg}</p><p class="text-sky-400 text-[10px] mt-1">${n.time}</p></div></div>`).join(''); openModal('notifDetailModal'); }

        // ITINERARY
        function openItinerary() { renderItinerary(); openModal('itineraryModal'); }
        function renderItinerary() { const icons = { plane: 'M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2', camera: 'M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z', sun: 'M12 2v2M12 20v2', food: 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Z' }; document.getElementById('itineraryContent').innerHTML = activeTrip.itinerary.map((day) => `<div class="mb-5"><div class="flex items-center gap-2 mb-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500 to-sky-600 flex items-center justify-center text-white font-bold text-xs">D${day.day}</div><div><h3 class="font-bold text-sky-900 text-sm">${day.title}</h3><p class="text-sky-500 text-[10px]">${day.date}</p></div></div><div class="pl-2">${day.activities.map(a => `<div class="timeline-mini-item"><div class="timeline-mini-dot"></div><div class="card p-2 mb-2"><div class="flex items-start gap-2"><div class="w-8 h-8 rounded-lg bg-sky-100/60 flex items-center justify-center flex-shrink-0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2"><path d="${icons[a.icon] || icons.camera}"/></svg></div><div class="flex-1"><span class="text-[10px] font-bold text-sky-500">${a.time}</span><h4 class="text-xs font-semibold text-sky-900">${a.title}</h4></div></div></div></div>`).join('')}</div></div>`).join(''); }

        // OTHERS
        function renderBooking() { 
            let html = ``;
            if (myBookings.length === 0) {
                html = `<div class="text-center py-10 text-sky-500">Kamu belum punya pesanan.<br>Klik destinasi di Home untuk pesan.</div>`;
            } else {
                html = myBookings.map(d => `
                    <div class="card overflow-hidden mb-4">
                        <img src="${d.img}" class="w-full h-32 object-cover">
                        <div class="p-4 relative z-10">
                            <h3 class="font-bold text-sky-900">${d.name}</h3>
                            <p class="text-sky-500 text-xs mb-1">${d.dur} • Rp ${d.price}</p>
                            <span class="bg-green-100 text-green-600 text-[10px] px-2 py-0.5 rounded-full font-bold">Terkonfirmasi</span>
                        </div>
                    </div>
                `).join('');
            }
            document.getElementById('bookingContent').innerHTML = html;
        }
        function renderChat() { document.getElementById('chatContent').innerHTML = `<div class="card p-3 flex items-center gap-3 cursor-pointer relative z-10" onclick="openChatDetail()"><div class="avatar-ring"><img src="${chatContacts[0].avatar}" class="w-10 h-10 rounded-full"></div><div class="flex-1"><h3 class="font-bold text-sky-900 text-sm">${chatContacts[0].name}</h3><p class="text-sky-500 text-xs truncate">${chatContacts[0].lastMsg}</p></div><div class="text-right"><span class="bg-orange-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">${chatContacts[0].unread}</span></div></div>`; }
        function openChatDetail() { document.getElementById('chatAvatar').src = chatContacts[0].avatar; document.getElementById('chatName').textContent = chatContacts[0].name; renderChatMessages(); openModal('chatModal'); }
        function renderChatMessages() { document.getElementById('chatMessages').innerHTML = chatHistory.map(m => `<div class="${m.sender === 'me' ? 'ml-auto bg-sky-500 text-white rounded-2xl rounded-br-sm' : 'mr-auto bg-white text-sky-900 rounded-2xl rounded-bl-sm'} max-w-[80%] p-2 text-xs mb-2">${m.msg}</div>`).join(''); }
        function sendChat() { const i = document.getElementById('chatInput'); if (i.value.trim()) { chatHistory.push({ sender: 'me', msg: i.value }); renderChatMessages(); i.value = ''; } }
        function handleChatEnter(e) { if (e.key === 'Enter') sendChat(); }
        function renderProfile() { document.getElementById('profileContent').innerHTML = `<div class="card p-5 text-center mb-4 relative z-10"><div class="avatar-ring inline-block mb-3"><img src="https://i.pravatar.cc/100?img=68" class="w-20 h-20 rounded-full"></div><h2 class="font-display text-lg font-bold text-sky-900">Nanda</h2><p class="text-sky-500 text-xs">nanda@tripzy.com</p></div><button class="w-full py-3 rounded-xl border-2 border-red-200 text-red-500 font-bold text-sm" onclick="handleLogout()">Keluar</button>`; }

        // UTILS
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function closeOnOverlay(e, id) { if (e.target.id === id) closeModal(id); }
        function showToast(m, t = 'success') { const toast = document.getElementById('toast'); document.getElementById('toastText').textContent = m; document.getElementById('toastIcon').innerHTML = t === 'success' ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'; toast.className = `toast ${t}`; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }
    </script>
</body>
</html>
